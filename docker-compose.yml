version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: helpdesk360-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/data/helpdesk.db
      - JWT_SECRET=helpdesk-360-enterprise-production-secret-key-2024
    volumes:
      - helpdesk-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/dashboard/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - helpdesk-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: helpdesk360-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge

volumes:
  helpdesk-db-data:
    driver: local
